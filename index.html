<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inertia</title>
<meta name="description" content="Inertia의 빛의 속력 측정 실험 자료. 공부자료와 준비 일정을 볼 수 있다.">
<meta property="og:title" content="Inertia">
<meta property="og:description" content="축전기와 코일로 빛의 속력 재기. 공부자료와 준비 일정.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111510" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<script src="site.js"></script>
<style>
.home{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(32px,6vh,72px) clamp(28px,5vh,48px);border-bottom:1px solid var(--rule)}

.wordmark{
  font-family:var(--sans);font-weight:200;
  font-size:clamp(72px,19vw,190px);line-height:.92;letter-spacing:-.055em;
  margin:clamp(10px,1.6vw,18px) 0 0;color:var(--ink);
}
.beam{position:relative;height:1px;background:var(--rule);margin:clamp(16px,2.6vw,28px) 0 clamp(14px,2vw,20px)}
.beam i{
  position:absolute;top:-3px;left:0;width:7px;height:7px;border-radius:50%;
  background:var(--light);box-shadow:0 0 12px 3px var(--light);
  animation:travel 3.4s cubic-bezier(.55,0,.25,1) infinite;
}
.beam i::after{content:"";position:absolute;right:100%;top:3px;width:110px;height:1px;background:linear-gradient(to left,var(--light),transparent)}
@keyframes travel{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:calc(100% - 7px);opacity:0}}
.tagline{font-family:var(--serif);font-weight:700;font-size:clamp(18px,3vw,26px);line-height:1.4;color:var(--ink2);margin:0}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,22px);margin-top:clamp(24px,4vw,40px)}
.card{
  --ac:var(--elec);
  position:relative;display:flex;flex-direction:column;gap:10px;
  min-height:clamp(196px,22vw,236px);padding:clamp(20px,2.6vw,28px);
  background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ac);border-radius:3px;
  color:var(--ink);text-decoration:none;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card.plan{--ac:var(--mag)}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--ac)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .idx{font:500 12px var(--mono);letter-spacing:.14em;color:var(--ink3)}
.card svg{width:56px;height:56px;color:var(--ac);flex:none}
.card h2{font-family:var(--serif);font-size:clamp(30px,4.6vw,42px);line-height:1.15;margin:0}
.card p{margin:0;color:var(--ink2);font-size:15.5px;max-width:30em}
.card .bottom{margin-top:auto;padding-top:16px;border-top:1px dashed var(--rule);display:flex;justify-content:space-between;gap:12px;align-items:center;font:500 12px var(--mono);letter-spacing:.06em;color:var(--ink3)}
.card .go{color:var(--ac);white-space:nowrap;transition:transform .18s ease}
.card:hover .go,.card:focus-visible .go{transform:translateX(4px)}

.status{margin-top:clamp(18px,3vw,30px);display:flex;flex-wrap:wrap;gap:10px}
.status:empty{display:none}
.pill{display:inline-flex;align-items:baseline;gap:10px;min-width:0;max-width:100%;padding:8px 15px;border:1px solid var(--rule);background:var(--card);border-radius:999px;font-size:14px;color:var(--ink2);text-decoration:none}
.pill b{font:500 13px var(--mono);color:var(--ink);letter-spacing:.04em;white-space:nowrap}
.pill .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.pill:hover,a.pill:focus-visible{border-color:var(--ink3);color:var(--ink)}

.bar{padding-block:18px;font-size:13px;color:var(--ink3)}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.bar p{margin:0}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow,.wordmark,.beam,.tagline{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.wordmark{animation-delay:.05s}.beam{animation-delay:.15s}.tagline{animation-delay:.22s}
.choices .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.choices .card:nth-child(1){animation-delay:.3s}.choices .card:nth-child(2){animation-delay:.38s}
.status{animation:rise .7s .46s cubic-bezier(.2,.7,.2,1) both}

@media (max-width:720px){
  .choices{grid-template-columns:1fr}
  .card{min-height:0}
}
@media print{.beam i{display:none}}
</style>
</head>
<body>
<a class="skip" href="#choose">메뉴로 건너뛰기</a>
<div class="home">
  <main class="stage gridbg">
    <div class="wrap">
      <p class="eyebrow">2026 POLARIS · 학술교류 포럼 준비</p>
      <h1 class="wordmark">Inertia</h1>
      <div class="beam" aria-hidden="true"><i></i></div>
      <p class="tagline">축전기와 코일로 빛의 속력 재기</p>

      <nav id="choose" class="choices" aria-label="보고 싶은 자료 고르기">
        <a class="card study" href="study.html">
          <span class="top">
            <span class="idx">01</span>
            <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M8 18h40M8 38h40"/>
              <path d="M16 18v20M28 18v20M40 18v20" stroke-width="1.4" stroke-dasharray="2 4"/>
              <path d="M28 8v10M28 38v10" stroke-width="1.6"/>
            </svg>
          </span>
          <h2>공부자료</h2>
          <p>전자기학 기초부터 실험 A·B·C, 데이터 분석, 발표 구성, 예상 질문 39개까지 정리했다.</p>
          <span class="bottom"><span>개정판 · 2026년 9월</span><span class="go">열기 &rarr;</span></span>
        </a>
        <a class="card plan" href="schedule.html">
          <span class="top">
            <span class="idx">02</span>
            <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="8" y="12" width="40" height="36" rx="3"/>
              <path d="M8 22h40M18 8v8M38 8v8"/>
              <circle cx="19" cy="31" r="2" fill="currentColor" stroke="none"/>
              <circle cx="28" cy="31" r="2" fill="currentColor" stroke="none"/>
              <circle cx="37" cy="31" r="2" fill="currentColor" stroke="none"/>
              <circle cx="19" cy="40" r="2" fill="currentColor" stroke="none"/>
              <circle cx="28" cy="40" r="2" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <h2>일정</h2>
          <p>10월 17일부터 11월 7일 발표까지 날짜별 할 일, 장소, 담당. 끝낸 일은 체크해 둘 수 있다.</p>
          <span class="bottom"><span id="plan-meta">10/17 &ndash; 11/7</span><span class="go">열기 &rarr;</span></span>
        </a>
      </nav>

      <div class="status" id="status"></div>
    </div>
  </main>
  <footer class="bar">
    <div class="wrap">
      <p>Inertia &middot; 북일고등학교 학술교류 포럼 &middot; 2026</p>
      <button class="tbtn" type="button" data-theme-toggle></button>
    </div>
  </footer>
</div>

<script src="schedule-data.js"></script>
<script>
(function () {
  var data = window.SCHEDULE;
  if (!data) return;
  var box = document.getElementById('status');
  var items = data.schedule.items;
  var today = Inertia.todayISO();

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.textContent = html;
    return n;
  }

  // 일정 카드의 작은 글씨
  var first = items[0], last = items[items.length - 1];
  document.getElementById('plan-meta').textContent =
    items.length + '칸 · ' + first.md + ' – ' + last.md;

  // 발표까지 남은 날
  var left = Inertia.daysBetween(today, data.event.date);
  var p1 = el('span', 'pill');
  var evP = data.event.date.split('-');
  var evMD = (+evP[1]) + '/' + (+evP[2]);
  var evWD = Inertia.weekday(data.event.date);
  p1.appendChild(el('b', null, left < 0 ? '종료' : Inertia.ddayLabel(left)));
  p1.appendChild(el('span', 't', left < 0
    ? data.event.name + '이 끝났다'
    : '발표까지 · ' + evMD + '(' + evWD + ') ' + data.event.place));
  box.appendChild(p1);

  // 다음 일정
  var next = Inertia.nextItem(items);
  if (next) {
    var a = el('a', 'pill');
    a.href = 'schedule.html#' + next.date;
    var when = next.date === today ? '오늘' : next.md + '(' + next.wd + ')';
    a.appendChild(el('b', null, '다음 일정'));
    a.appendChild(el('span', 't', when + ' ' + next.slot + ' · ' + Inertia.firstChunk(next.task)));
    box.appendChild(a);
  }
})();
</script>
</body>
</html>
