<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inertia</title>
<meta name="description" content="빛을 쓰지 않고 빛의 속력을 잰다. Inertia의 학술교류 포럼 공부자료와 준비 일정.">
<meta property="og:title" content="Inertia">
<meta property="og:description" content="빛을 쓰지 않고 빛의 속력을 잰다. 공부자료와 준비 일정.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F4F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111510" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<script>
  // 다른 페이지에서 고른 화면 모드(라이트/다크)를 그대로 따른다
  try { var m = localStorage.getItem('inertia-theme'); if (m) document.documentElement.setAttribute('data-theme', m); } catch (e) {}
</script>
<style>
/* 이 페이지는 다른 파일 없이 혼자 그려진다. 배경색과 글자색을 한곳에서 정한다. */
:root{
  --bg:#F4F6F1; --card:#FFFFFF; --ink:#191E1A; --ink2:#4B564F; --ink3:#6F7A72; --rule:#D9DED5;
  --blue:#1B5A8B; --rust:#A6411B;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --display:'Instrument Serif','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111510; --card:#191E1A; --ink:#ECEFE9; --ink2:#B4BDB6; --ink3:#8E978F; --rule:#2E352F;
    --blue:#7DBBE8; --rust:#EE9A76;
  }
}
:root[data-theme="dark"]{
  --bg:#111510; --card:#191E1A; --ink:#ECEFE9; --ink2:#B4BDB6; --ink3:#8E978F; --rule:#2E352F;
  --blue:#7DBBE8; --rust:#EE9A76;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-weight:400;-webkit-text-size-adjust:100%;word-break:keep-all}

.home{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
.wordmark{font-family:var(--display);font-weight:400;font-size:clamp(84px,17vw,168px);line-height:1;letter-spacing:-.02em;margin:0;color:var(--ink)}
.tag{margin:14px 0 0;font-size:clamp(16px,2.4vw,19px);color:var(--ink2)}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:600px;margin-top:clamp(36px,7vh,56px)}
.choice{
  --ac:var(--blue);
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  padding:24px 24px 22px;text-align:left;
  background:var(--card);border:1px solid var(--rule);border-radius:16px;
  color:var(--ink);text-decoration:none;
  transition:border-color .2s ease,transform .2s ease;
}
.choice.plan{--ac:var(--rust)}
.choice:hover,.choice:focus-visible{border-color:var(--ac);transform:translateY(-2px)}
.choice:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.choice .t{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:24px;font-weight:600;letter-spacing:-.01em}
.choice .t::after{content:"\2192";font-weight:400;color:var(--ac);transition:transform .2s ease}
.choice:hover .t::after,.choice:focus-visible .t::after{transform:translateX(4px)}
.choice .d{font-size:15px;line-height:1.55;color:var(--ink2)}

.meta{margin:clamp(28px,5vh,40px) 0 0;font-size:14px;color:var(--ink3)}
.meta b{font-weight:600;color:var(--ink)}

.home>*{animation:in .6s ease both}
.home>.tag{animation-delay:.08s}
.home>.choices{animation-delay:.16s}
.home>.meta{animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.home>*{animation:none}.choice,.choice .t::after{transition:none}}
@media (max-width:520px){
  .choices{grid-template-columns:1fr}
  .choice{padding:20px}
}
</style>
</head>
<body>
<main class="home">
  <h1 class="wordmark">Inertia</h1>
  <p class="tag">빛을 쓰지 않고 빛의 속력을 잰다</p>

  <nav class="choices" aria-label="보고 싶은 자료 고르기">
    <a class="choice study" href="study.html">
      <span class="t">공부자료</span>
      <span class="d">기초 개념, 실험 세 가지, 데이터 분석, 예상 질문</span>
    </a>
    <a class="choice plan" href="schedule.html">
      <span class="t">일정</span>
      <span class="d">10월 17일부터 11월 7일까지 날짜별 할 일</span>
    </a>
  </nav>

  <p class="meta">11월 7일 북일고등학교 발표 <b id="dday"></b></p>
</main>
<script>
  (function () {
    var t = new Date(), a = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()), b = Date.UTC(2026, 10, 7);
    var n = Math.round((b - a) / 864e5);
    document.getElementById('dday').textContent = n > 0 ? '· D-' + n : (n === 0 ? '· 오늘' : '');
  })();
</script>
</body>
</html>
